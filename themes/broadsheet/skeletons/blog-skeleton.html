<article class="post type-post status-publish format-standard hentry post-single">
    <header class="entry-header">
        <div class="entry-meta">
            <span class="posted-on">
                <time class="entry-date published" datetime=""><!-- build.js puts the date here --></time>
            </span>
        </div>
        <h1 class="entry-title"><!-- build.js puts the title here --></h1>
    </header>

    <div class="entry-content">
        <!-- build.js puts the Markdown body here -->

    <footer class="entry-footer">
        <nav class="navigation post-navigation" aria-label="Posts">
            <h2 class="screen-reader-text">Post navigation</h2>
            <div id="post-nav-placeholder">
                <!-- build.js puts the older and newer links here -->
            </div>
        </nav>
    </footer>
</article>
